<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500">
  <defs>
    <style>
      .label { font-family: Inter, sans-serif; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; fill: #5a5550; }
      .lead { stroke: #5a5550; stroke-width: 0.5; stroke-dasharray: 3 3; fill: none; }
      .organ { stroke: #2b3a4a; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
      .ghost { stroke: #2b3a4a; fill: none; stroke-width: 1; stroke-dasharray: 6 4; opacity: 0.35; }
      .highlight { stroke: #2b3a4a; fill: #f0ede9; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .thin { stroke: #2b3a4a; fill: none; stroke-width: 1; stroke-linecap: round; stroke-linejoin: round; }
      .staple { stroke: #2b3a4a; stroke-width: 1; stroke-linecap: round; }
    </style>
  </defs>

  <!-- Esophagus -->
  <path d="M260,40 L260,95 Q258,108 256,118" class="organ"/>
  <path d="M274,40 L274,95 Q272,108 270,118" class="organ"/>

  <!-- Sleeve stomach (banana shape) -->
  <path d="M256,118 Q248,132 244,152 Q240,178 238,210 Q236,245 238,275 Q240,300 248,320 Q256,335 268,340 Q280,338 286,320 Q292,300 294,275 Q296,245 295,210 Q294,178 290,152 Q286,132 278,122 Q274,118 270,118" class="highlight"/>

  <!-- Staple line marks on left -->
  <line x1="250" y1="138" x2="244" y2="142" class="staple"/>
  <line x1="246" y1="160" x2="240" y2="164" class="staple"/>
  <line x1="243" y1="185" x2="237" y2="189" class="staple"/>
  <line x1="241" y1="210" x2="235" y2="214" class="staple"/>
  <line x1="241" y1="235" x2="235" y2="239" class="staple"/>
  <line x1="243" y1="260" x2="237" y2="264" class="staple"/>
  <line x1="245" y1="285" x2="239" y2="289" class="staple"/>
  <line x1="250" y1="308" x2="244" y2="312" class="staple"/>

  <!-- Pylorus area -->
  <path d="M268,340 Q278,348 290,352" class="organ"/>
  <ellipse cx="285" cy="349" rx="10" ry="4" class="thin" style="stroke-width:1;"/>

  <!-- Duodenum (short, then cut) -->
  <path d="M290,352 Q305,358 315,368 Q322,378 320,388" class="organ" style="stroke-width:1.5;"/>

  <!-- Duodenal switch point - cut mark -->
  <line x1="312" y1="385" x2="328" y2="385" class="thin" style="stroke-width:1.5; stroke: #2b3a4a;"/>
  <line x1="312" y1="390" x2="328" y2="390" class="thin" style="stroke-width:1.5; stroke: #2b3a4a;"/>

  <!-- Single anastomosis circle -->
  <circle cx="320" cy="388" r="5" fill="none" stroke="#2b3a4a" stroke-width="1.5"/>

  <!-- Bypassed small bowel (ghost) - long loop -->
  <path d="M320,393 Q325,410 330,425 Q340,445 355,450 Q375,452 388,440 Q398,425 395,405 Q390,385 380,370 Q368,355 355,350 Q340,348 330,355 Q320,365 318,380" class="ghost"/>

  <!-- Ileum connecting to duodenum (alimentary limb) -->
  <path d="M320,393 Q315,410 310,425 Q305,445 310,460 Q318,475 330,478" class="organ" style="stroke-width:1.3;"/>

  <!-- Common channel -->
  <path d="M330,478 Q345,480 355,475 Q365,468 368,455 Q370,440 365,428" class="organ" style="stroke-width:1.5;"/>

  <!-- Flow arrows -->
  <polygon points="312,420 308,414 316,414" fill="#2b3a4a" opacity="0.5"/>
  <polygon points="365,445 361,451 369,451" fill="#2b3a4a" opacity="0.5"/>

  <!-- Labels -->
  <!-- Sleeve -->
  <text x="130" y="225" class="label">Sleeve</text>
  <line x1="175" y1="223" x2="236" y2="225" class="lead"/>

  <!-- Duodenal Switch -->
  <text x="360" y="370" class="label">Duodenal Switch</text>
  <line x1="358" y1="368" x2="328" y2="380" class="lead"/>

  <!-- Single Anastomosis -->
  <text x="365" y="400" class="label">Single Anastomosis</text>
  <line x1="363" y1="398" x2="327" y2="392" class="lead"/>

  <!-- Common Channel -->
  <text x="390" y="462" class="label">Common Channel</text>
  <line x1="388" y1="460" x2="370" y2="455" class="lead"/>
</svg>