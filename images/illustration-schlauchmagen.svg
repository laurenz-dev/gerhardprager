<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500">
  <defs>
    <style>
      .label { font-family: Inter, sans-serif; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; fill: #5a5550; }
      .lead { stroke: #5a5550; stroke-width: 0.5; stroke-dasharray: 3 3; fill: none; }
      .organ { stroke: #2b3a4a; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
      .ghost { stroke: #2b3a4a; fill: none; stroke-width: 1; stroke-dasharray: 6 4; opacity: 0.35; }
      .highlight { stroke: #2b3a4a; fill: #f0ede9; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .thin { stroke: #2b3a4a; fill: none; stroke-width: 1; stroke-linecap: round; stroke-linejoin: round; }
      .staple { stroke: #2b3a4a; stroke-width: 1.2; stroke-linecap: round; }
    </style>
  </defs>

  <!-- Esophagus -->
  <path d="M280,45 L280,105 Q278,120 276,130" class="organ"/>
  <path d="M296,45 L296,105 Q294,120 292,130" class="organ"/>

  <!-- Sleeve (banana-shaped remaining stomach) -->
  <path d="M276,130 Q268,145 264,165 Q260,190 258,220 Q256,250 258,280 Q260,310 268,335 Q275,355 290,370 Q305,380 318,375 Q325,370 322,355 Q318,335 314,310 Q310,280 308,250 Q306,220 308,190 Q310,165 305,145 Q300,135 292,130" class="highlight"/>

  <!-- Internal fold lines in sleeve -->
  <path d="M272,180 Q278,190 275,205" class="thin" style="stroke-width:0.6; opacity:0.5;"/>
  <path d="M270,240 Q276,250 273,265" class="thin" style="stroke-width:0.6; opacity:0.5;"/>
  <path d="M272,300 Q280,310 278,325" class="thin" style="stroke-width:0.6; opacity:0.5;"/>

  <!-- Resected portion (ghost) -->
  <path d="M276,130 Q255,140 235,165 Q215,195 205,230 Q195,270 200,310 Q205,340 220,360 Q240,380 265,385 Q280,385 290,370" class="ghost"/>
  <!-- Ghost interior -->
  <path d="M230,200 Q240,215 235,235" class="ghost" style="stroke-width:0.6;"/>
  <path d="M220,270 Q230,285 225,305" class="ghost" style="stroke-width:0.6;"/>

  <!-- Staple line (left side of sleeve) -->
  <line x1="272" y1="140" x2="266" y2="145" class="staple"/>
  <line x1="278" y1="143" x2="272" y2="148" class="staple"/>
  <line x1="268" y1="158" x2="262" y2="163" class="staple"/>
  <line x1="274" y1="161" x2="268" y2="166" class="staple"/>
  <line x1="265" y1="180" x2="259" y2="185" class="staple"/>
  <line x1="271" y1="183" x2="265" y2="188" class="staple"/>
  <line x1="263" y1="205" x2="257" y2="210" class="staple"/>
  <line x1="269" y1="208" x2="263" y2="213" class="staple"/>
  <line x1="261" y1="230" x2="255" y2="235" class="staple"/>
  <line x1="267" y1="233" x2="261" y2="238" class="staple"/>
  <line x1="261" y1="255" x2="255" y2="260" class="staple"/>
  <line x1="267" y1="258" x2="261" y2="263" class="staple"/>
  <line x1="263" y1="280" x2="257" y2="285" class="staple"/>
  <line x1="269" y1="283" x2="263" y2="288" class="staple"/>
  <line x1="266" y1="305" x2="260" y2="310" class="staple"/>
  <line x1="272" y1="308" x2="266" y2="313" class="staple"/>
  <line x1="272" y1="330" x2="266" y2="335" class="staple"/>
  <line x1="278" y1="333" x2="272" y2="338" class="staple"/>

  <!-- Pylorus / duodenum exit -->
  <path d="M318,375 Q330,378 340,382 Q355,388 360,400 L362,415" class="organ"/>
  <path d="M290,370 Q300,380 310,385 Q325,392 335,400 L337,415" class="organ"/>
  <!-- Pylorus ring -->
  <ellipse cx="349" cy="408" rx="14" ry="5" class="thin" style="stroke-width:1;"/>

  <!-- Labels -->
  <!-- Sleeve -->
  <text x="360" y="230" class="label">Sleeve</text>
  <line x1="358" y1="228" x2="312" y2="230" class="lead"/>

  <!-- Resected Portion -->
  <text x="90" y="280" class="label">Resected Portion</text>
  <line x1="230" y1="278" x2="218" y2="275" class="lead"/>

  <!-- Staple Line -->
  <text x="120" y="195" class="label">Staple Line</text>
  <line x1="198" y1="193" x2="260" y2="195" class="lead"/>

  <!-- Pylorus -->
  <text x="390" y="410" class="label">Pylorus</text>
  <line x1="388" y1="408" x2="365" y2="408" class="lead"/>
</svg>