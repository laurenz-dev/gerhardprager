<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500">
  <defs>
    <style>
      .label { font-family: Inter, sans-serif; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; fill: #5a5550; }
      .lead { stroke: #5a5550; stroke-width: 0.5; stroke-dasharray: 3 3; fill: none; }
      .organ { stroke: #2b3a4a; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
      .ghost { stroke: #2b3a4a; fill: none; stroke-width: 1; stroke-dasharray: 6 4; opacity: 0.4; }
      .highlight { stroke: #2b3a4a; fill: #f0ede9; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
      .thin { stroke: #2b3a4a; fill: none; stroke-width: 1; stroke-linecap: round; stroke-linejoin: round; }
      .subtle-fill { fill: #e8e4df; stroke: #2b3a4a; stroke-width: 1; }
    </style>
  </defs>

  <!-- Esophagus -->
  <path d="M280,40 L280,100 Q280,115 278,125" class="organ"/>
  <path d="M292,40 L292,100 Q292,115 290,125" class="organ"/>

  <!-- Small gastric pouch -->
  <path d="M278,125 Q265,135 262,155 Q260,175 270,185 Q280,192 290,185 Q300,175 298,155 Q296,135 290,125" class="highlight"/>

  <!-- Bypassed stomach (ghost) -->
  <path d="M262,155 Q240,160 225,185 Q210,215 215,250 Q220,280 240,295 Q260,305 285,300 Q310,295 320,275 Q330,255 325,230 Q320,205 310,190 Q300,175 298,155" class="ghost"/>
  <!-- Stomach interior folds ghost -->
  <path d="M235,200 Q245,210 240,225" class="ghost" style="stroke-width:0.7"/>
  <path d="M245,230 Q255,240 250,255" class="ghost" style="stroke-width:0.7"/>

  <!-- Duodenum from bypassed stomach -->
  <path d="M285,300 Q300,310 310,325 Q320,345 315,360 Q310,375 295,380" class="ghost"/>

  <!-- Roux limb (alimentary) from pouch down -->
  <path d="M270,185 Q260,200 255,215 L250,240 Q248,260 255,280 Q262,300 270,315 Q278,330 285,345 Q290,360 295,380" class="highlight" style="stroke-width:1.5; fill:none;"/>

  <!-- Biliopancreatic limb -->
  <path d="M295,380 Q300,395 310,400 Q330,405 345,395 Q355,385 355,370 Q355,350 345,335 Q335,320 330,305 Q325,290 330,275 Q335,260 340,250" class="thin"/>
  <!-- Pancreas hint -->
  <path d="M340,250 Q355,245 370,248 Q385,252 395,260" class="subtle-fill" style="stroke-width:1;"/>

  <!-- Common channel -->
  <path d="M295,380 Q290,400 288,420 L285,450 Q283,465 285,475" class="organ" style="stroke-width:1.5;"/>

  <!-- Anastomosis marks at pouch-jejunum junction -->
  <line x1="265" y1="183" x2="275" y2="187" class="thin" style="stroke-width:0.8;"/>
  <line x1="267" y1="180" x2="277" y2="184" class="thin" style="stroke-width:0.8;"/>
  <line x1="269" y1="177" x2="279" y2="181" class="thin" style="stroke-width:0.8;"/>

  <!-- Anastomosis at Y-junction -->
  <circle cx="295" cy="380" r="4" fill="none" stroke="#2b3a4a" stroke-width="1.5"/>

  <!-- Labels -->
  <!-- Pouch -->
  <text x="155" y="158" class="label">Pouch</text>
  <line x1="193" y1="156" x2="260" y2="160" class="lead"/>

  <!-- Bypassed Stomach -->
  <text x="100" y="265" class="label">Bypassed Stomach</text>
  <line x1="232" y1="263" x2="245" y2="250" class="lead"/>

  <!-- Roux-Limb -->
  <text x="140" y="330" class="label">Roux-Limb</text>
  <line x1="210" y1="328" x2="265" y2="320" class="lead"/>

  <!-- Biliopancreatic Limb -->
  <text x="370" y="340" class="label">Biliopancreatic Limb</text>
  <line x1="368" y1="338" x2="342" y2="340" class="lead"/>

  <!-- Common Channel -->
  <text x="320" y="450" class="label">Common Channel</text>
  <line x1="318" y1="448" x2="290" y2="445" class="lead"/>

  <!-- Small directional arrows on limbs -->
  <polygon points="260,270 255,264 265,264" fill="#2b3a4a" opacity="0.5"/>
  <polygon points="340,290 335,296 345,296" fill="#2b3a4a" opacity="0.5"/>
  <polygon points="287,440 283,434 291,434" fill="#2b3a4a" opacity="0.5"/>
</svg>