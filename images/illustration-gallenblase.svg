<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 500">
  <defs>
    <style>
      .label { font-family: Inter, sans-serif; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; fill: #5a5550; }
      .lead { stroke: #5a5550; stroke-width: 0.5; stroke-dasharray: 3 3; fill: none; }
      .organ { stroke: #2b3a4a; fill: none; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round; }
      .highlight { stroke: #2b3a4a; fill: #f0ede9; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
      .thin { stroke: #2b3a4a; fill: none; stroke-width: 1; stroke-linecap: round; stroke-linejoin: round; }
      .duct { stroke: #2b3a4a; fill: none; stroke-width: 1.2; stroke-linecap: round; }
      .trocar { fill: none; stroke: #2b3a4a; stroke-width: 1; }
      .instrument { stroke: #2b3a4a; stroke-width: 1; stroke-linecap: round; stroke-dasharray: 8 4; }
    </style>
  </defs>

  <!-- Liver (partial outline, upper right) -->
  <path d="M120,60 Q200,50 300,55 Q400,60 460,80 Q500,95 520,120 Q535,145 530,175 Q525,205 505,230 Q485,252 455,268 Q420,282 380,288 Q340,292 300,288 Q260,284 230,272 Q200,260 180,242 Q160,222 150,198 Q140,170 135,140 Q132,110 120,60" fill="#f0ede9" stroke="#2b3a4a" stroke-width="1.5" stroke-linejoin="round"/>
  <!-- Liver surface detail -->
  <path d="M200,100 Q250,95 300,100" class="thin" style="stroke-width:0.5; opacity:0.3;"/>
  <path d="M180,140 Q230,135 280,140" class="thin" style="stroke-width:0.5; opacity:0.3;"/>
  <path d="M350,110 Q400,105 440,115" class="thin" style="stroke-width:0.5; opacity:0.3;"/>
  <!-- Liver edge detail -->
  <path d="M160,220 Q170,230 185,238" class="thin" style="stroke-width:0.4; opacity:0.25;"/>

  <!-- Gallbladder (pear-shaped, attached to liver undersurface) -->
  <path d="M310,230 Q320,240 330,260 Q338,285 340,310 Q340,340 332,360 Q322,378 308,385 Q294,378 284,360 Q276,340 276,310 Q278,285 286,260 Q294,240 304,232 Q307,230 310,230" class="highlight"/>
  <!-- Gallbladder internal folds -->
  <path d="M298,280 Q305,290 302,305" class="thin" style="stroke-width:0.5; opacity:0.4;"/>
  <path d="M315,300 Q320,315 316,330" class="thin" style="stroke-width:0.5; opacity:0.4;"/>

  <!-- Gallbladder neck -->
  <path d="M310,230 Q308,222 302,218 Q295,215 288,218" class="organ" style="stroke-width:1.3;"/>

  <!-- Cystic duct -->
  <path d="M288,218 Q275,225 268,238 Q262,252 260,268 Q258,282 262,295" class="duct"/>
  <!-- Cystic duct spiral valve hint -->
  <path d="M278,228 Q272,232 276,238" class="thin" style="stroke-width:0.5; opacity:0.5;"/>
  <path d="M270,245 Q264,250 268,256" class="thin" style="stroke-width:0.5; opacity:0.5;"/>

  <!-- Common hepatic duct (coming from liver) -->
  <path d="M265,180 Q260,200 258,220 Q256,245 258,268 Q260,282 262,295" class="duct"/>

  <!-- Common bile duct (after junction) -->
  <path d="M262,295 Q260,320 258,345 Q256,370 258,395 Q260,415 265,435" class="duct" style="stroke-width:1.4;"/>

  <!-- Triangle of Calot (subtle highlight) -->
  <path d="M288,218 L262,295 L310,230 Z" fill="none" stroke="#2b3a4a" stroke-width="0.5" stroke-dasharray="4 3" opacity="0.3"/>

  <!-- Cystic artery (thin line through Calot triangle) -->
  <path d="M240,240 Q260,248 285,235" class="thin" style="stroke-width:0.6; stroke-dasharray: 2 2; opacity:0.5;"/>

  <!-- Trocar insertion points -->
  <circle cx="300" cy="60" r="5" class="trocar"/>
  <circle cx="300" cy="60" r="2" fill="#2b3a4a" opacity="0.3"/>
  <circle cx="200" cy="80" r="4" class="trocar"/>
  <circle cx="200" cy="80" r="1.5" fill="#2b3a4a" opacity="0.3"/>
  <circle cx="400" cy="85" r="4" class="trocar"/>
  <circle cx="400" cy="85" r="1.5" fill="#2b3a4a" opacity="0.3"/>
  <circle cx="170" cy="130" r="4" class="trocar"/>
  <circle cx="170" cy="130" r="1.5" fill="#2b3a4a" opacity="0.3"/>

  <!-- Surgical instrument lines -->
  <path d="M200,80 Q230,140 270,200 Q285,218 295,228" class="instrument"/>
  <path d="M400,85 Q380,140 360,200 Q345,230 330,260" class="instrument"/>

  <!-- Labels -->
  <!-- Gallbladder -->
  <text x="375" y="330" class="label">Gallbladder</text>
  <line x1="373" y1="328" x2="342" y2="325" class="lead"/>

  <!-- Cystic Duct -->
  <text x="120" y="248" class="label">Cystic Duct</text>
  <line x1="210" y1="246" x2="270" y2="245" class="lead"/>

  <!-- Common Bile Duct -->
  <text x="110" y="380" class="label">Common Bile Duct</text>
  <line x1="242" y1="378" x2="258" y2="378" class="lead"/>

  <!-- Liver -->
  <text x="410" y="155" class="label">Liver</text>
  <line x1="408" y1="153" x2="390" y2="155" class="lead"/>
</svg>